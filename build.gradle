buildscript {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.15.5"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

// Release output is isolated so regular and preserved jars remain untouched.
def releaseProfile = providers.gradleProperty('releaseBuild').map { it.toBoolean() }.getOrElse(false)
if (releaseProfile) {
    layout.buildDirectory = layout.projectDirectory.dir('build-release')
}

loom {
    accessWidenerPath = file("src/main/resources/mcsreasymode.accesswidener")
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + (releaseProfile ? '-release' : '')
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation include("net.fabricmc.fabric-api:fabric-resource-loader-v0:${project.fabric_resource_loader_version}")
    modImplementation "com.github.contariaa:SpeedrunAPI:v2.1-1.16.1"
}

processResources {
    inputs.property "releaseBuild", releaseProfile
    filesMatching("mcsreasymode-build.properties") {
        expand releaseBuild: releaseProfile
    }
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 8
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Exercise clearance after noise-grid interpolation without adding a test framework.
sourceSets {
    routeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('routeShapeTest', JavaExec) {
    dependsOn routeTestClasses
    classpath = sourceSets.routeTest.runtimeClasspath
    mainClass = 'me.dota1g.mcsreasymode.NetherRouteShapeTest'
}
tasks.named('check') { dependsOn 'routeShapeTest' }

tasks.register('routeStateTest', JavaExec) {
    dependsOn routeTestClasses
    classpath = sourceSets.routeTest.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'me.dota1g.mcsreasymode.NetherRouteStateTest'
}
tasks.named('check') { dependsOn 'routeStateTest' }

tasks.register('pieChartPathsTest', JavaExec) {
    dependsOn routeTestClasses
    classpath = sourceSets.routeTest.runtimeClasspath
    mainClass = 'me.dota1g.mcsreasymode.PieChartPathsTest'
}
tasks.named('check') { dependsOn 'pieChartPathsTest' }

tasks.register('villageLavaPoolTest', JavaExec) {
    dependsOn routeTestClasses
    classpath = sourceSets.routeTest.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'me.dota1g.mcsreasymode.VillageLavaPoolTest'
}
tasks.named('check') { dependsOn 'villageLavaPoolTest' }

tasks.register('villageSmithSiteTest', JavaExec) {
    dependsOn routeTestClasses
    classpath = sourceSets.routeTest.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'me.dota1g.mcsreasymode.VillageSmithSiteTest'
}
tasks.named('check') { dependsOn 'villageSmithSiteTest' }

tasks.register('villageResourceTest', JavaExec) {
    dependsOn routeTestClasses
    classpath = sourceSets.routeTest.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'me.dota1g.mcsreasymode.VillageResourceTest'
}
tasks.named('check') { dependsOn 'villageResourceTest' }
